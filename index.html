<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buluşalım mı?</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Special+Elite&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4efe1;--ink:#111;--pink:#ff2d87;--yellow:#ffe600;--blue:#1f4bff;--muted:#444;--card:#fffdf6}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141414;--ink:#f4efe1;--card:#1e1e1e;--muted:#bbb}}
  :root[data-theme="dark"]{--paper:#141414;--ink:#f4efe1;--card:#1e1e1e;--muted:#bbb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font-family:"Special Elite",monospace;
    background-color:var(--paper);
    background-image:radial-gradient(var(--ink) 1px,transparent 1.2px),repeating-linear-gradient(-8deg,transparent 0 38px,rgba(255,45,135,.07) 38px 40px);
    background-size:14px 14px,auto;background-blend-mode:normal}
  body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.86;pointer-events:none;z-index:0}
  .card{position:relative;z-index:1;width:100%;max-width:440px;background:var(--card);border:4px solid var(--ink);padding:30px 22px 24px;transform:rotate(-1.2deg);
    box-shadow:9px 9px 0 var(--pink),9px 9px 0 4px var(--ink)}
  .card::before{content:"";position:absolute;top:-16px;left:50%;width:110px;height:30px;background:var(--yellow);border:2px solid var(--ink);transform:translateX(-50%) rotate(3deg);opacity:.92}
  .card::after{content:"✕";position:absolute;top:8px;right:12px;font-family:"Archivo Black";font-size:22px;color:var(--pink)}
  .progress{height:12px;border:3px solid var(--ink);margin-bottom:22px;background:var(--card)}
  .progress i{display:block;height:100%;width:0;transition:width .3s;background:repeating-linear-gradient(45deg,var(--pink) 0 8px,var(--ink) 8px 16px)}
  h1{font-family:"Archivo Black",sans-serif;font-size:27px;line-height:1.15;margin:0 0 8px;text-transform:uppercase}
  h1 .r{display:inline-block;padding:0 4px;margin:1px 1px;border:2px solid var(--ink)}
  h1 .r:nth-child(5n+1){background:var(--yellow);color:#111;transform:rotate(-3deg)}
  h1 .r:nth-child(5n+2){background:#111;color:#f4efe1;transform:rotate(2deg);font-family:"Rubik Mono One"}
  h1 .r:nth-child(5n+3){background:var(--pink);color:#111;transform:rotate(-1deg)}
  h1 .r:nth-child(5n+4){background:#fff;color:#111;transform:rotate(3deg);font-family:"Special Elite"}
  h1 .r:nth-child(5n){background:var(--blue);color:#fff;transform:rotate(-2deg)}
  p.sub{color:var(--muted);margin:10px 0 20px;font-size:15px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:3px solid var(--ink);background:var(--card);font:inherit;font-size:16px;color:var(--ink);cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s;box-shadow:4px 4px 0 var(--ink)}
  .opt:nth-child(odd){transform:rotate(.6deg)}.opt:nth-child(even){transform:rotate(-.6deg)}
  .opt:hover{transform:rotate(0) translate(-2px,-2px);box-shadow:6px 6px 0 var(--blue)}
  .opt.sel{background:var(--yellow);color:#111;box-shadow:6px 6px 0 var(--pink)}
  .opt span{font-size:22px}
  input[type=text],input[type=date],input[type=time]{width:100%;padding:12px;border:3px dashed var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin-top:6px}
  label{display:block;font-size:13px;margin-top:14px;text-transform:uppercase;letter-spacing:.08em;font-family:"Archivo Black"}
  .nav{display:flex;gap:10px;margin-top:24px}
  .btn{flex:1;padding:14px;border:3px solid var(--ink)!important;font-family:"Archivo Black";font-size:16px;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .primary{background:var(--pink);color:#111}
  .primary:disabled{opacity:.35;cursor:not-allowed}
  .ghost{background:var(--card);color:var(--ink)}
  .summary{border:3px solid var(--ink);background:repeating-linear-gradient(0deg,var(--card) 0 27px,rgba(31,75,255,.18) 27px 28px);padding:14px 16px;margin:18px 0;line-height:28px;transform:rotate(.8deg)}
  .summary b{background:var(--yellow);color:#111;padding:0 3px}
  .big{font-size:58px;text-align:center;margin-bottom:6px;filter:drop-shadow(4px 4px 0 var(--pink))}
</style>
</head>
<body>
<main class="card">
  <div class="progress"><i id="bar"></i></div>
  <div id="step"></div>
</main>
<script>
const steps = [
  {key:'donus', title:'İstanbul\'dan ne zaman dönüyorsun?', sub:'Önce bunu bilmem lazım 🙂', date:'return'},
  {key:'ilgi', title:'Döndüğünde benimle bir buluşmaya çıkar mısın?', sub:'Dürüst ol, kırılmam 🙂', options:[['💖','Evet, isterim!'],['🙈','Hayır, teşekkürler']]},
  {key:'yer', title:'Ankara\'da ne yapmak istersin?', sub:'Birini seç ya da kendin yaz.', options:[['🍺','Bira içmeye gidelim'],['🍷','Şarap içmeye gidelim'],['🍽️','Bir şeyler yiyelim'],['🥣','Çorba içmeye gidelim'],['💐','Zaten bana çorba ve çiçek alan biri var']], other:true},
  {key:'yemek', title:'Ne yemek istersin?', options:[['🍕','Pizza / İtalyan'],['🍣','Sushi'],['🥙','Kebap / Türk mutfağı'],['🍔','Burger'],['🥗','Hafif bir şeyler']], other:true},
  {key:'icecek', title:'Ne içmek istersin?', options:[['☕','Kahve'],['🫖','Çay'],['🍷','Şarap'],['🍺','Bira'],['🍹','Kokteyl'],['🥤','Alkolsüz bir şey']], other:true},
  {key:'zaman', title:'Ne zaman müsaitsin?', sub:'Döndükten sonra sana uyan bir gün ve saat seç.', date:'slot'},
];
const ans = {}; let i = 0;
const el = document.getElementById('step'), bar = document.getElementById('bar');

function ransom(t){ return t.split(' ').map(w=>`<span class="r">${w}</span>`).join(' '); }
function render(){
  bar.style.width = (i / steps.length * 100) + '%';
  if (i >= steps.length) return done();
  if (steps[i].key==='ilgi' && !ans.donus) { i=0; }
  const s = steps[i]; let h = `<h1>${ransom(s.title)}</h1>${s.sub?`<p class="sub">${s.sub}</p>`:'<p class="sub"></p>'}`;
  if (s.options){
    h += '<div class="opts">' + s.options.map(([e,t])=>`<button class="opt${ans[s.key]===t?' sel':''}" data-v="${t}"><span>${e}</span>${t}</button>`).join('') + '</div>';
    if (s.other) h += `<label>Başka bir şey:</label><input type="text" id="other" placeholder="Yaz..." value="${s.options.some(o=>o[1]===ans[s.key])?'':(ans[s.key]||'')}">`;
  }
  if (s.date){
    const z = ans[s.key] || {};
    h += `<label>${s.date==='return'?'Dönüş günü':'Gün'}</label><input type="date" id="d" value="${z.d||''}">` + (s.date==='slot'?`<label>Saat</label><input type="time" id="t" value="${z.t||''}">`:'');
  }
  h += `<div class="nav">${i>0?'<button class="btn ghost" id="back">Geri</button>':''}${s.key==='ilgi'?'':`<button class="btn primary" id="next">${i===steps.length-1?'Gönder':'İleri'}</button>`}</div>`;
  el.innerHTML = h;

  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ans[s.key]=b.dataset.v;
    if (s.key==='ilgi'){ if (b.dataset.v.startsWith('Hayır')) return no(); i++; return render(); }
    if (b.dataset.v.startsWith('Zaten')){ delete ans.yer; return rival(); }
    const o=document.getElementById('other'); if(o) o.value='';
    el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); check();
  });
  const o=document.getElementById('other'); if(o) o.oninput=()=>{ if(o.value.trim()){ans[s.key]=o.value.trim(); el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));} else if(!s.options.some(x=>x[1]===ans[s.key])) delete ans[s.key]; check(); };
  if (s.date){ const d=document.getElementById('d'), t=document.getElementById('t');
    const today=new Date().toISOString().slice(0,10);
    d.min = s.date==='slot' && ans.donus ? ans.donus.d : today;
    const f=()=>{ ans[s.key]={d:d.value,t:t?t.value:''}; check(); }; d.oninput=f; if(t) t.oninput=f; }
  const back=document.getElementById('back'); if(back) back.onclick=()=>{i--;render();};
  const next=document.getElementById('next'); if(next) next.onclick=()=>{i++;render();};
  check();
}
function check(){
  const n=document.getElementById('next'); if(!n) return;
  const s=steps[i]; const z=ans[s.key]; n.disabled = s.date ? !(z&&z.d&&(s.date==='return'||z.t)) : !ans[s.key];
}
function fmtDay(z){ return new Date(z.d+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}); }
function fmtDate(z){ return new Date(z.d+'T'+z.t).toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}) + ', saat ' + z.t; }
function done(){
  bar.style.width='100%';
  const msg = `Buluşma planım 💖\n✈️ İstanbul'dan dönüş: ${fmtDay(ans.donus)}\n📍 Yer: ${ans.yer}\n🍽️ Yemek: ${ans.yemek}\n🥂 İçecek: ${ans.icecek}\n📅 Zaman: ${fmtDate(ans.zaman)}`;
  el.innerHTML = `<div class="big">🥳</div><h1 style="text-align:center">${ransom('Harika, buluşuyoruz!')}</h1>
  <div class="summary">✈️ <b>Dönüş:</b> ${fmtDay(ans.donus)}<br>📍 <b>Yer:</b> ${ans.yer}<br>🍽️ <b>Yemek:</b> ${ans.yemek}<br>🥂 <b>İçecek:</b> ${ans.icecek}<br>📅 <b>Zaman:</b> ${fmtDate(ans.zaman)}</div>
  <div class="nav" style="flex-direction:column">
    <a class="btn primary" style="text-align:center;text-decoration:none;display:block" href="https://wa.me/905348359020?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp ile Utku’ya gönder</a>
    <button class="btn ghost" id="copy">Metni kopyala</button>
    <button class="btn ghost" id="again">Baştan başla</button>
  </div>`;
  document.getElementById('copy').onclick=e=>{navigator.clipboard.writeText(msg).then(()=>e.target.textContent='Kopyalandı ✓');};
  document.getElementById('again').onclick=reset;
}
function no(){
  bar.style.width='100%';
  el.innerHTML = `<div class="big">🥲</div><h1 style="text-align:center">${ransom('Anlaşıldı, sorun değil.')}</h1><p class="sub" style="text-align:center">Fikrin değişirse buradayım.</p><div class="nav"><button class="btn ghost" id="again">Fikrimi değiştirdim</button></div>`;
  document.getElementById('again').onclick=reset;
}
function rival(){
  el.innerHTML = `<div class="big">💐🥣</div><h1 style="text-align:center">${ransom('Hmm... anlıyorum.')}</h1>
  <p class="sub" style="text-align:center">Peki, yine de beni görmek ister misin?</p>
  <div class="nav"><button class="btn primary" id="yes">Evet</button><button class="btn ghost" id="nope">Hayır</button></div>`;
  document.getElementById('yes').onclick=()=>render();
  document.getElementById('nope').onclick=reset;
}
function reset(){ for(const k in ans) delete ans[k]; i=0; render(); }
render();
</script>
</body>
</html>
